name: Launcher and Simulator Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, development]
        default: stable
        description: Release channel
concurrency:
  group: player-release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.version.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      OFS_CHANNEL: ${{ inputs.channel || (endsWith(github.ref_name, '-development') && 'development' || 'stable') }}
    steps:
      - uses: actions/checkout@v5
      - name: Build only a new or unfinished game version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, tempfile
          from launcher.manifest import Release
          from launcher.storage import read_json
          version = re.search(r'project\(OpenFlightSim VERSION ([0-9.]+)', pathlib.Path('CMakeLists.txt').read_text())[1]
          tag = 'v' + version + ('-development' if os.environ['OFS_CHANNEL'] == 'development' else '')
          response = subprocess.run(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{tag}'], capture_output=True, text=True)
          if response.returncode and '(HTTP 404)' not in response.stderr:
              raise SystemExit(response.stderr)
          release = json.loads(response.stdout) if not response.returncode else None
          build = not release or release['draft']
          if release and not release['draft'] and not any(a['name'] == 'manifest.json' for a in release['assets']):
              raise SystemExit('Existing version release lacks its manifest; review it before publishing')
          if not build:
              with tempfile.TemporaryDirectory() as temporary:
                  subprocess.run(['gh', 'release', 'download', 'launcher-updates', '--repo', os.environ['GITHUB_REPOSITORY'], '--pattern', 'manifest.json', '--dir', temporary], check=True)
                  index = read_json(pathlib.Path(temporary) / 'manifest.json')
                  entries = [Release.parse(entry) for entry in index['releases']]
                  if not any(entry.version == version and entry.data['channel'] == os.environ['OFS_CHANNEL'] for entry in entries):
                      raise SystemExit('Published version is absent from the launcher index; restore the index before reporting delivery')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build={str(build).lower()}\n')
          print(f'{tag}: ' + ('build and publish' if build else 'already published; increment the game version for a new release'))
          PY
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      OFS_ASSET_PACK_URL: ${{ secrets.OFS_ASSET_PACK_URL }}
      OFS_ASSET_PACK_SHA256: ${{ secrets.OFS_ASSET_PACK_SHA256 }}
      OFS_ASSET_PACK_SIZE: ${{ secrets.OFS_ASSET_PACK_SIZE }}
      OFS_UPDATE_BASE_URL: ${{ vars.OFS_UPDATE_BASE_URL }}
      OFS_CHANNEL: ${{ inputs.channel || (endsWith(github.ref_name, '-development') && 'development' || 'stable') }}
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release inputs and tag
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = re.search(r'project\(OpenFlightSim VERSION ([0-9.]+)', pathlib.Path('CMakeLists.txt').read_text())[1]
          ref = os.environ['GITHUB_REF']
          tag = 'v' + version + ('-development' if os.environ['OFS_CHANNEL'] == 'development' else '')
          if ref.startswith('refs/tags/') and ref != 'refs/tags/' + tag:
              raise SystemExit('Tag must match the CMake project version')
          for key in ('OFS_ASSET_PACK_URL', 'OFS_ASSET_PACK_SHA256', 'OFS_ASSET_PACK_SIZE', 'OFS_UPDATE_BASE_URL'):
              if not os.environ.get(key):
                  raise SystemExit(f'{key} must be configured before release packaging')
          expected = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/launcher-updates'
          if os.environ['OFS_UPDATE_BASE_URL'] != expected:
              raise SystemExit('Update base URL must use this public repository launcher-updates release')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'OFS_DOWNLOAD_BASE_URL=https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{tag}\n')
          PY
      - name: Launcher dependencies and tests
        run: |
          python -m pip install -r launcher/requirements.txt
          python -m unittest discover -s launcher/tests -v
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libgl-dev libegl-dev libssl-dev libprotobuf-dev protobuf-compiler libxkbcommon0 libxcb-cursor0
      - name: Windows dependency cache directory
        id: vcpkg-environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          $cacheVersion = $env:ImageVersion
          if (-not $cacheVersion) { $cacheVersion = $env:GITHUB_RUN_ID }
          "version=$cacheVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-windows-openssl-protobuf-${{ runner.os }}-v2-${{ steps.vcpkg-environment.outputs.version }}
          restore-keys: |
            vcpkg-x64-windows-openssl-protobuf-${{ runner.os }}-v2-
            vcpkg-x64-windows-openssl-protobuf-${{ runner.os }}-v1
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install openssl:x64-windows protobuf:x64-windows
      - uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-windows-openssl-protobuf-${{ runner.os }}-v2-${{ steps.vcpkg-environment.outputs.version }}
      - name: Restore compiled Windows dependencies
        uses: actions/cache/restore@v4
        id: native-cache
        continue-on-error: true
        with:
          path: build/release
          key: windows-native-build-${{ steps.vcpkg-environment.outputs.version }}-${{ hashFiles('cmake/Dependencies.cmake', 'network/CMakeLists.txt') }}-v1
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFS_RELEASE_CHANNEL=${{ env.OFS_CHANNEL }}
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DOFS_RELEASE_CHANNEL=$env:OFS_CHANNEL" -DOFS_INCLUDE_SU57=ON -DOFS_REQUIRE_PRODUCTION_ASSETS=OFF -DOFS_ASSET_KEY_FILE=
      - name: Build simulator, server and compiled catalogue
        run: cmake --build build/release --config Release --parallel 3
      - name: Check source provenance first
        run: ctest --test-dir build/release -C Release --output-on-failure -R "^regression.provenance"
      - name: Full source regressions with the development aircraft registry
        run: ctest --test-dir build/release -C Release --output-on-failure --parallel 3
      - name: Preserve compiled Windows dependencies
        uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: build/release
          key: windows-native-build-${{ steps.vcpkg-environment.outputs.version }}-${{ hashFiles('cmake/Dependencies.cmake', 'network/CMakeLists.txt') }}-v1
      # No shipped aircraft is encrypted, so player binaries carry no content key.
      # The JF-17 donor's origin is unresolved (docs/ASSET_RELEASE_PROVENANCE.md),
      # so player builds leave it out until its artwork is approved.
      - name: Configure player registry with the four approved aircraft
        run: cmake -S . -B build/release -DOFS_INCLUDE_SU57=ON -DOFS_INCLUDE_JF17=OFF -DOFS_REQUIRE_PRODUCTION_ASSETS=ON -DOFS_ASSET_KEY_FILE=
      - name: Rebuild the player binaries and catalogue
        run: cmake --build build/release --config Release --parallel 3
      - name: Provision approved release assets
        run: python scripts/provision_release_assets.py --catalog build/release/launcher-catalog.json --cache build/approved-assets.zip
      - name: Require all player aircraft and authored LODs
        run: ctest --test-dir build/release -C Release --output-on-failure --parallel 3 -R "^(player.registry|assets.production|client.asset_pipeline|sr71.assets|sr71.registry|typhoon.assets|typhoon.registry|su57.assets|su57.replay|su57.multiplayer|assets.protected_pack|combat.solo_gun|bots.guidance|bots.connection|launcher.security_config)$"
      - name: Install simulator and runtime DLLs
        run: cmake --install build/release --config Release --prefix build/stage
      - name: Capture launcher artwork from the installed game
        shell: bash
        run: |
          python scripts/capture_launcher_previews.py --client build/stage/ofs_client.exe \
            --catalog build/stage/launcher-catalog.json --asset-root build/stage \
            --output build/stage/data/launcher/previews --preset Medium --frames 6 \
            --width 1280 --height 720
      - name: Collect build dependency notices
        run: python scripts/collect_release_notices.py --build build/release --output build/stage
      - name: Add asset license notices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('licenses/assets')
          if source.is_dir():
              shutil.copytree(source, Path('build/stage/licenses/assets'), dirs_exist_ok=True)
          PY
      - name: Freeze native launcher and updater
        run: python scripts/package_launcher.py --build build/release --output build/bundles --base-url "${{ env.OFS_UPDATE_BASE_URL }}"
      - name: Smoke test standalone setup without development dependencies
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          suffix = '.exe' if os.name == 'nt' else ''
          subprocess.run([str(pathlib.Path('build/bundles/OpenFlightSim-Setup' + suffix).resolve()),
                          '--installation', str(pathlib.Path('build/setup-smoke/game').resolve()),
                          '--user-data', str(pathlib.Path('build/setup-smoke/user').resolve()),
                          '--screenshot', str(pathlib.Path('build/setup-smoke/setup.png').resolve())], check=True, timeout=90)
          if not pathlib.Path('build/setup-smoke/setup.png').is_file():
              raise SystemExit('Standalone setup did not render')
          PY
        # The public update feed exists from the first player release onward.
        # Run TLS from the actual frozen setup, without the PC's system CA roots.
      - name: Verify frozen setup HTTPS downloads with bundled certificates
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          executable = pathlib.Path('build/bundles/OpenFlightSim-Setup.exe').resolve()
          report = pathlib.Path('build/setup-smoke/https.json').resolve()
          subprocess.run([str(executable), '--check-downloads', str(report)], check=True, timeout=120)
          result = json.loads(report.read_text())
          if not result['certificate_verification'] or not result['hostname_verification'] or result['bundled_ca_count'] < 100:
              raise SystemExit('Frozen setup lacks verified bundled certificate roots')
          print(f"Verified public manifest and release file using {result['bundled_ca_count']} bundled certificate roots")
          PY
      - name: Build install/update archives and repair file index
        run: python scripts/package_release.py --simulator build/stage --bundles build/bundles --output build/publish --base-url "${{ env.OFS_UPDATE_BASE_URL }}" --download-base-url "${{ env.OFS_DOWNLOAD_BASE_URL }}" --flat-downloads --asset-approval asset-approval.json --notes docs/LAUNCHER_RELEASE_NOTES.md
      - name: Combine platform descriptors
        shell: bash
        run: python scripts/merge_update_manifests.py --output build/publish/manifest.json build/publish/*-manifest.json
      - name: Publish matching Qt and PySide sources
        shell: bash
        run: python scripts/publish_dependency_sources.py --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --directory build/dependency-sources
      - name: Publish game downloads and advance launcher index last
        shell: bash
        run: python scripts/publish_github_release.py --directory build/publish --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --notes docs/LAUNCHER_RELEASE_NOTES.md
