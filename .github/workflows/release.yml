name: Launcher and Simulator Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, development]
        default: development
        description: Release channel
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      OFS_ASSET_PACK_URL: ${{ secrets.OFS_ASSET_PACK_URL }}
      OFS_ASSET_PACK_SHA256: ${{ secrets.OFS_ASSET_PACK_SHA256 }}
      OFS_ASSET_PACK_SIZE: ${{ secrets.OFS_ASSET_PACK_SIZE }}
      OFS_UPDATE_BASE_URL: ${{ vars.OFS_UPDATE_BASE_URL }}
      OFS_CHANNEL: ${{ inputs.channel || 'stable' }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release inputs and tag
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = re.search(r'project\(OpenFlightSim VERSION ([0-9.]+)', pathlib.Path('CMakeLists.txt').read_text())[1]
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != 'refs/tags/v' + version:
              raise SystemExit('Tag must match the CMake project version')
          for key in ('OFS_ASSET_PACK_URL', 'OFS_ASSET_PACK_SHA256', 'OFS_ASSET_PACK_SIZE', 'OFS_UPDATE_BASE_URL'):
              if not os.environ.get(key):
                  raise SystemExit(f'{key} must be configured before release packaging')
          PY
      - name: Launcher dependencies and tests
        run: |
          python -m pip install -r launcher/requirements.txt
          python -m unittest discover -s launcher/tests -v
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libgl-dev libegl-dev libssl-dev libprotobuf-dev protobuf-compiler libxkbcommon0 libxcb-cursor0
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install openssl:x64-windows protobuf:x64-windows
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFS_RELEASE_CHANNEL=${{ env.OFS_CHANNEL }}
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DOFS_RELEASE_CHANNEL=$env:OFS_CHANNEL"
      - name: Build simulator, server and compiled catalogue
        run: cmake --build build/release --config Release --parallel 3
      - name: Provision approved release assets
        run: python scripts/provision_release_assets.py --catalog build/release/launcher-catalog.json --cache build/approved-assets.zip
      - name: Regressions including installed content
        run: ctest --test-dir build/release -C Release --output-on-failure --parallel 3
      - name: Install simulator and runtime DLLs
        run: cmake --install build/release --config Release --prefix build/stage
      - name: Collect build dependency notices
        run: python scripts/collect_release_notices.py --build build/release --output build/stage
      - name: Add asset license notices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('licenses/assets')
          if source.is_dir():
              shutil.copytree(source, Path('build/stage/licenses/assets'), dirs_exist_ok=True)
          PY
      - name: Freeze native launcher and updater
        run: python scripts/package_launcher.py --build build/release --output build/bundles --base-url "${{ env.OFS_UPDATE_BASE_URL }}"
      - name: Smoke test standalone setup without development dependencies
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          suffix = '.exe' if os.name == 'nt' else ''
          subprocess.run([str(pathlib.Path('build/bundles/OpenFlightSim-Setup' + suffix).resolve()),
                          '--installation', str(pathlib.Path('build/setup-smoke/game').resolve()),
                          '--user-data', str(pathlib.Path('build/setup-smoke/user').resolve()),
                          '--screenshot', str(pathlib.Path('build/setup-smoke/setup.png').resolve())], check=True, timeout=90)
          if not pathlib.Path('build/setup-smoke/setup.png').is_file():
              raise SystemExit('Standalone setup did not render')
          PY
      - name: Build install/update archives and repair file index
        run: python scripts/package_release.py --simulator build/stage --bundles build/bundles --output build/publish --base-url "${{ env.OFS_UPDATE_BASE_URL }}" --asset-approval asset-approval.json --notes docs/LAUNCHER_RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFlightSim-${{ matrix.platform }}
          path: |
            build/publish/*-install.zip
            build/publish/*-update.zip
            build/publish/*-manifest.json
            build/publish/*-SHA256SUMS.txt
            build/publish/*-setup.exe
            build/publish/*-setup
            build/setup-smoke/setup.png
            build/publish/files/**
          retention-days: 14
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenFlightSim-*
          path: build/publish
          merge-multiple: true
      - name: Combine Windows and Linux descriptors
        run: python scripts/merge_update_manifests.py --output build/publish/manifest.json build/publish/*-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFlightSim-publish
          path: build/publish
          retention-days: 14
